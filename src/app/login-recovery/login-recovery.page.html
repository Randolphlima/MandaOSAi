<ion-header>
  <ion-toolbar class="header-roxo" toolbar-title-align="center">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login-home"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Configurações</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1 class="ion-text-center">Recuperação de Senha</h1>

  <p class="ion-padding ion-text-center">Para receber seu código e criar uma nova senha, precisamos confirmar seu
    celular. Por favor, informe seu número para que possamos enviar o código de verificação por SMS. 📱</p>

  <div class="ion-padding ion-margin-top">

    <ion-input label="Digite o seu celular" type="tel" label-placement="floating" color="light" fill="outline"
      placeholder="(11) 98765-4321"></ion-input><br><br>

    <ion-button expand="block" color="light" style="padding-bottom: 12px;">
      Recuperar Senha
    </ion-button>

  </div>


</ion-content>
