<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title class="ion-text-center">Lista de Chamados</ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/home-config">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Botões -->
  <ion-grid>
    <ion-row>
      <ion-col size="4">
        <ion-button expand="block" fill="outline">18/11/2025</ion-button>
      </ion-col>

      <ion-col size="4">
        <ion-button expand="block" fill="outline">Filtro</ion-button>
      </ion-col>

      <ion-col size="4">
        <ion-button expand="block" fill="outline">Refresh</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Lista de chamados -->
  <ion-card *ngFor="let c of chamados" class="status-card-{{c.status.toLowerCase()}}" (click)="abrirChamado(c)">

    <ion-card-header>
      <ion-card-title>{{c.nome}}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>Chamado: {{c.descricao}}</p>
      <p>Endereço: {{c.endereco}}</p>

      <div class="card-footer">
        <ion-badge class="status-button" disabled>
          {{c.status | uppercase}}
        </ion-badge>
      </div>
    </ion-card-content>

  </ion-card>

</ion-content>
