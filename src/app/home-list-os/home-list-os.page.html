<ion-header>
  <ion-toolbar class="header-roxo">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title class="ion-text-center">Lista de Chamados</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="abrirConfig()">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-grid>
    <ion-row>

      <ion-col size="6">
        <ion-select #selectStatus aria-label="Status" interface="popover" [(ngModel)]="statusSelecionado"
          (ionChange)="filtrarChamados()" class="hidden-select">
          <ion-select-option *ngFor="let option of statusOptions" [value]="option.value">
            {{ option.label }}
          </ion-select-option>
        </ion-select>

        <ion-button expand="block" fill="outline" color="light" (click)="selectStatus.open()">
          <ion-icon name="funnel-outline" slot="start"></ion-icon>
          {{ getStatusLabel() }}
        </ion-button>
      </ion-col>

      <ion-col size="6">
        <ion-button expand="block" fill="outline" color="light" (click)="refreshChamados()">
          <ion-icon name="sync-outline" slot="start"></ion-icon>
          Refresh
        </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card *ngFor="let c of chamadosFiltrados" class="status-card-{{c.status.toLowerCase()}}"
    (click)="abrirChamado(c)">

    <ion-card-header>
      <ion-card-title>{{c.nome}}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>Chamado: {{c.descricao}}</p>
      <p>Endereço: {{c.endereco}}</p>

      <div class="card-footer">
        <ion-badge class="status-button" disabled>
          {{c.status | uppercase}}
        </ion-badge>
      </div>
    </ion-card-content>

  </ion-card>

</ion-content>
